[package]
name = "zarc"
description = "Command-line tool for creating and managing ZAR archives"
documentation = "https://github.com/brmmm3/zar-rs/blob/master/zarc/README.md"
homepage = "https://github.com/brmmm3/zar-rs"
repository = "https://github.com/brmmm3/zar-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
clap.workspace = true
indicatif.workspace = true
libc = "0.2"
zarlib = { version = "0.11.0", path = "../zarlib" }

[dev-dependencies]
flate2 = "1.1"
rars = { version = "0.12.4", default-features = false, features = ["write"] }

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = [
    "win_direct_tls",
], optional = true }

[target.'cfg(unix)'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = [
    "local_dynamic_tls",
], optional = true }
