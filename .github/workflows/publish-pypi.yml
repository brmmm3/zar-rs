name: Publish pyzarlib to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag containing pyzarlib distributions"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyzarlib
    steps:
      - name: Download distributions from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'pyzarlib-*.whl' --pattern 'pyzarlib-*.tar.gz' --dir dist
          shopt -s nullglob
          wheels=(dist/pyzarlib-*.whl)
          sdists=(dist/pyzarlib-*.tar.gz)
          if [[ ${#wheels[@]} -eq 0 || ${#sdists[@]} -ne 1 ]]; then
            echo "Expected at least one pyzarlib wheel and exactly one source distribution" >&2
            exit 1
          fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1 # zizmor: ignore[unpinned-uses]
        with:
          packages-dir: dist/
          skip-existing: true
