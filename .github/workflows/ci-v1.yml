name: x86-64-v1 release

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing source release tag (x.y.z)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing source release tag (x.y.z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate source tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate tag name
        id: validate
        env:
          SOURCE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Source tag must be a stable x.y.z version" >&2
            exit 1
          fi
          echo "tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
      - name: Checkout source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.validate.outputs.tag }}
          persist-credentials: false
      - name: Validate package versions and record commit
        id: commit
        env:
          SOURCE_TAG: ${{ steps.validate.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          workspace_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          python_version=$(sed -n '/^\[project\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' pyzarlib/pyproject.toml)
          if [[ "$SOURCE_TAG" != "$workspace_version" || "$SOURCE_TAG" != "$python_version" ]]; then
            echo "Tag $SOURCE_TAG must match workspace ($workspace_version) and Python ($python_version) versions" >&2
            exit 1
          fi
          gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build baseline binaries (${{ matrix.platform.name }})
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64-static
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            static: true
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev pkg-config
      - name: Install musl toolchain
        if: matrix.platform.static == true
        run: sudo apt-get install --yes musl-tools
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}
      - name: Build zarc and zarg
        env:
          RUSTFLAGS: ${{ matrix.platform.static && '-C target-cpu=x86-64 -C target-feature=+crt-static' || '-C target-cpu=x86-64' }}
          CFLAGS: ${{ runner.os != 'Windows' && '-march=x86-64' || '' }}
          CXXFLAGS: ${{ runner.os != 'Windows' && '-march=x86-64' || '' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.platform.static && 'musl-gcc' || '' }}
          TARGET: ${{ matrix.platform.target }}
        run: cargo build --release --locked --target ${{ matrix.platform.target }} --workspace --bin zarc --bin zarg
      - name: Smoke test zarc
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            "target/$TARGET/release/zarc.exe" --version
          else
            "target/$TARGET/release/zarc" --version
          fi
      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform.name }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          mkdir -p "dist/zar-rs-$PLATFORM-v1"
          cp "target/$TARGET/release/zarc" "target/$TARGET/release/zarg" "dist/zar-rs-$PLATFORM-v1/"
          tar -C dist -czf "dist/zar-rs-$PLATFORM-v1.tar.gz" "zar-rs-$PLATFORM-v1"
      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform.name }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          New-Item -ItemType Directory -Force -Path "dist/zar-rs-$env:PLATFORM-v1" | Out-Null
          Copy-Item "target/$env:TARGET/release/zarc.exe", "target/$env:TARGET/release/zarg.exe" "dist/zar-rs-$env:PLATFORM-v1/"
          Compress-Archive -Path "dist/zar-rs-$env:PLATFORM-v1" -DestinationPath "dist/zar-rs-$env:PLATFORM-v1.zip"
      - name: Upload binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: binaries-${{ matrix.platform.name }}-v1
          path: dist/zar-rs-${{ matrix.platform.name }}-v1.*
          if-no-files-found: error

  wheels:
    name: Build baseline wheels (${{ matrix.platform.name }})
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - name: windows-x64
            runner: windows-latest
            target: x64
    steps:
      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          RUSTFLAGS: -C target-cpu=x86-64
          CFLAGS: ${{ runner.os != 'Windows' && '-march=x86-64' || '' }}
          CXXFLAGS: ${{ runner.os != 'Windows' && '-march=x86-64' || '' }}
        with:
          rust-toolchain: stable
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --interpreter 3.11 3.12 3.13 3.14 3.15
          manylinux: auto
          docker-options: -e RUSTFLAGS -e CFLAGS -e CXXFLAGS
          working-directory: pyzarlib
      - name: Set up Python for wheel smoke test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: '3.11'
      - name: Install and import the Python 3.11 wheel
        shell: bash
        run: |
          python -m pip install --no-deps pyzarlib/dist/*cp311*.whl
          python -c "import pyzarlib; print(pyzarlib.__file__)"
      - name: Package baseline wheels
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform.name }}
        run: |
          cd pyzarlib/dist
          shopt -s nullglob
          wheels=(./*.whl)
          if [[ ${#wheels[@]} -lt 5 ]]; then
            echo "Expected at least five wheels for $PLATFORM, found ${#wheels[@]}" >&2
            exit 1
          fi
          python -m zipfile -c "pyzarlib-wheels-$PLATFORM-v1.zip" "${wheels[@]}"
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: wheels-${{ matrix.platform.name }}-v1
          path: pyzarlib/dist/*-v1.zip
          if-no-files-found: error

  publish:
    name: Attach baseline assets to release
    needs: [prepare, binaries, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*-v1
          path: dist
          merge-multiple: true
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*-v1
          path: dist
          merge-multiple: true
      - name: Check release assets
        shell: bash
        run: |
          shopt -s nullglob
          binaries=(dist/zar-rs-*-v1.tar.gz dist/zar-rs-*-v1.zip)
          wheels=(dist/pyzarlib-wheels-*-v1.zip)
          [[ ${#binaries[@]} -eq 4 && ${#wheels[@]} -eq 3 ]]
      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  packages:
    name: Package baseline release
    needs: [prepare, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/packaging-v1.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
