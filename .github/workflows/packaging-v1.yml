name: x86-64-v1 packaging

on:
    branches-ignore:
      - master
    tags:
      - '[0-9]*\.[0-9]*\.[0-9]*-v1'
      - '!*-v3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-packaging-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate source and baseline release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tags and existing release
        id: validate
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Source tag must be a stable x.y.z version" >&2
            exit 1
          fi
          release_tag="$SOURCE_TAG-v1"
          source_sha=$(git rev-parse --verify "refs/tags/$SOURCE_TAG^{commit}")
          release_sha=$(git rev-parse --verify "refs/tags/$release_tag^{commit}")
          if [[ "$source_sha" != "$release_sha" ]]; then
            echo "Tag $release_tag does not point to the source commit" >&2
            exit 1
          fi
          version=$(git show "$source_sha:Cargo.toml" | sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}')
          if [[ "$version" != "$SOURCE_TAG" ]]; then
            echo "Tag $SOURCE_TAG does not match workspace version $version" >&2
            exit 1
          fi
          gh release view "$release_tag" --repo "$REPO" >/dev/null
          echo "tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  linux-packages:
    name: Linux baseline package (${{ matrix.format }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm, appimage, flatpak]
    steps:
      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Download baseline Linux binaries
        if: matrix.format != 'flatpak'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          mkdir -p reused
          gh release download "$RELEASE_TAG" --repo "$REPO" \
            --pattern 'zar-rs-linux-x86_64-v1.tar.gz' --dir reused
          mkdir -p dist/reused
          tar -xzf reused/zar-rs-linux-x86_64-v1.tar.gz -C dist/reused
          test -x dist/reused/zar-rs-linux-x86_64-v1/zarc
          test -x dist/reused/zar-rs-linux-x86_64-v1/zarg
          echo "BIN_DIR=$PWD/dist/reused/zar-rs-linux-x86_64-v1" >> "$GITHUB_ENV"
          echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
      - name: Install packaging tools
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          sudo apt-get update
          case "$FORMAT" in
            deb) sudo apt-get install -y libxcb1-dev ;;
            rpm) sudo apt-get install -y libxcb1-dev rpm ;;
            appimage)
              sudo apt-get install -y libxcb1-dev
              sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
              curl -fsSL -o /tmp/appimagetool \
                https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x /tmp/appimagetool
              echo "APPIMAGETOOL=/tmp/appimagetool" >> "$GITHUB_ENV"
              echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
              ;;
            flatpak)
              sudo apt-get install -y flatpak flatpak-builder
              flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
              flatpak install --user -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 \
                org.freedesktop.Sdk.Extension.rust-stable//26.08
              ;;
          esac
      - name: Set Flatpak sandbox compiler flags
        if: matrix.format == 'flatpak'
        run: |
          manifest=packaging/linux/io.github.brmmm3.Zarg.yml
          if [[ $(grep -c '^    CARGO_HOME:' "$manifest") -ne 1 ]]; then
            echo "Cannot locate the Flatpak build environment in $manifest" >&2
            exit 1
          fi
          if grep -Eq '^    (RUSTFLAGS|CFLAGS|CXXFLAGS):' "$manifest"; then
            echo "Flatpak manifest already defines compiler flags; review the baseline override" >&2
            exit 1
          fi
          sed -i '/^    CARGO_HOME:/a\    RUSTFLAGS: "-C target-cpu=x86-64"\n    CFLAGS: "-march=x86-64"\n    CXXFLAGS: "-march=x86-64"' "$manifest"
      - name: Build package
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          packaging/linux/build-packages.sh "$FORMAT"
          shopt -s nullglob
          packages=(dist/*.deb dist/*.rpm dist/*.AppImage dist/*.flatpak)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one $FORMAT package" >&2
            exit 1
          fi
          package="${packages[0]}"
          mv "$package" "${package%.*}-v1.${package##*.}"
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1-package-${{ matrix.format }}
          path: |
            dist/*-v1.deb
            dist/*-v1.rpm
            dist/*-v1.AppImage
            dist/*-v1.flatpak
          if-no-files-found: error

  windows-installer:
    name: Windows baseline installer
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Download baseline Windows binaries
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reused | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:REPO --pattern 'zar-rs-windows-x86_64-v1.zip' --dir reused
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath 'reused/zar-rs-windows-x86_64-v1.zip' -DestinationPath reused/extracted
          $binaryDir = Join-Path $PWD 'reused/extracted/zar-rs-windows-x86_64-v1'
          foreach ($binary in @('zarc.exe', 'zarg.exe')) {
            if (!(Test-Path (Join-Path $binaryDir $binary))) { throw "Missing $binary in $binaryDir" }
          }
          "BINARY_DIR=$binaryDir" >> $env:GITHUB_ENV
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Build baseline zcopy
        env:
          RUSTFLAGS: -C target-cpu=x86-64
        shell: pwsh
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc --workspace --bin zcopy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/x86_64-pc-windows-msvc/release/zcopy.exe $env:BINARY_DIR
          & (Join-Path $env:BINARY_DIR 'zcopy.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DArch=x64" "/DSourceDir=$env:BINARY_DIR" packaging\windows\zar-rs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem 'dist/*-setup.exe')
          if ($packages.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          Rename-Item $packages[0].FullName ($packages[0].BaseName + '-v1.exe')
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1-package-windows-x64
          path: dist/*-setup-v1.exe
          if-no-files-found: error

  macos-packages:
    name: macOS baseline packages
    needs: prepare
    runs-on: macos-15-intel
    steps:
      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Download baseline macOS binaries
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          mkdir -p reused
          gh release download "$RELEASE_TAG" --repo "$REPO" \
            --pattern 'zar-rs-macos-x86_64-v1.tar.gz' --dir reused
          mkdir -p dist/reused
          tar -xzf reused/zar-rs-macos-x86_64-v1.tar.gz -C dist/reused
          test -x dist/reused/zar-rs-macos-x86_64-v1/zarc
          test -x dist/reused/zar-rs-macos-x86_64-v1/zarg
          echo "BIN_DIR=$PWD/dist/reused/zar-rs-macos-x86_64-v1" >> "$GITHUB_ENV"
          echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
      - name: Build packages
        run: |
          packaging/macos/build-packages.sh all
          for extension in dmg pkg; do
            set -- dist/*."$extension"
            if [[ $# -ne 1 || ! -f "$1" ]]; then
              echo "Expected exactly one .$extension package" >&2
              exit 1
            fi
            mv "$1" "${1%.*}-v1.$extension"
          done
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1-package-macos-x86_64
          path: |
            dist/*-v1.dmg
            dist/*-v1.pkg
          if-no-files-found: error

  attach-to-release:
    name: Attach baseline packages
    needs: [prepare, linux-packages, windows-installer, macos-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: v1-package-*
          path: packages
          merge-multiple: true
      - name: Verify and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(packages/*-v1.deb packages/*-v1.rpm packages/*-v1.AppImage \
            packages/*-v1.flatpak packages/*-setup-v1.exe packages/*-v1.dmg packages/*-v1.pkg)
          if [[ ${#packages[@]} -ne 7 ]]; then
            echo "Expected seven baseline package assets, found ${#packages[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${packages[@]}" --repo "$REPO" --clobber
