name: czarlib

on:
  push:
    paths:
      - "czarlib/**"
      - "zarlib/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/czarlib.yml"
  pull_request:
    paths:
      - "czarlib/**"
      - "zarlib/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/czarlib.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C library
        run: cargo build -p czarlib
      - name: Run native zarlib tests
        run: cargo test -p zarlib
      - name: Run C API integration tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I czarlib/include \
            czarlib/tests/test_c_api.c -L target/debug -lczarlib \
            -Wl,-rpath,"$PWD/target/debug" -pthread -o /tmp/czarlib-test
          /tmp/czarlib-test
      - name: Build and exercise C zarc example
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I czarlib/include \
            czarlib/examples/zarc.c -L target/debug -lczarlib \
            -Wl,-rpath,"$PWD/target/debug" -o /tmp/zarc-c
          /tmp/zarc-c --help
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          printf 'initial' > "$temp_dir/input.txt"
          printf 'added' > "$temp_dir/added.txt"
          (
            cd "$temp_dir"
            /tmp/zarc-c c sample.zar input.txt
            /tmp/zarc-c a sample.zar added.txt
            /tmp/zarc-c k sample.zar
            info_json=$(/tmp/zarc-c i sample.zar)
            printf '%s\n' "$info_json"
            from_id=$(printf '%s' "$info_json" | jq -r '.[0].id')
            through_id=$(printf '%s' "$info_json" | jq -r '.[1].id')
            test "$from_id" != null
            test "$through_id" != null
            /tmp/zarc-c l sample.zar
            /tmp/zarc-c e sample.zar restored --dry-run
            /tmp/zarc-c r sample.zar added.txt
            /tmp/zarc-c j sample.zar --from "$from_id" --through "$through_id"
          )
