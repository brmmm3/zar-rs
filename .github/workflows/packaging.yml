name: Packaging

on:
  push:
    branches-ignore:
      - master
    tags:
      - '[0-9]*\.[0-9]*\.[0-9]*-v3'
      - '!*-v1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  find-reusable-ci-run:
    name: Find same-commit CI artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find successful CI run for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/find-successful-ci-run.sh

  linux-packages:
    name: Linux packages (${{ matrix.format }})
    needs: find-reusable-ci-run
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm, appimage, flatpak]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Linux binaries from successful same-commit CI run
        id: reuse
        if: matrix.format != 'flatpak' && needs.find-reusable-ci-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zar-rs-binaries-verified-linux-x86_64
          path: reused
          run-id: ${{ needs.find-reusable-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare reused Linux binaries
        if: steps.reuse.outcome == 'success'
        run: |
          mkdir -p dist/reused
          tar -xzf reused/zar-rs-linux-x86_64.tar.gz -C dist/reused
          echo "BIN_DIR=$PWD/dist/reused/zar-rs-linux-x86_64" >> "$GITHUB_ENV"
          echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        if: matrix.format != 'flatpak' && steps.reuse.outcome != 'success'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
      - name: Install packaging tools
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          sudo apt-get update
          case "$FORMAT" in
            deb) sudo apt-get install -y libxcb1-dev ;;
            rpm) sudo apt-get install -y libxcb1-dev rpm ;;
            appimage)
              sudo apt-get install -y libxcb1-dev
              sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
              curl -fsSL -o /tmp/appimagetool \
                https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x /tmp/appimagetool
              echo "APPIMAGETOOL=/tmp/appimagetool" >> "$GITHUB_ENV"
              echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
              ;;
            flatpak)
              sudo apt-get install -y flatpak flatpak-builder
              flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
              flatpak install --user -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 \
                org.freedesktop.Sdk.Extension.rust-stable//26.08
              ;;
          esac
      - name: Set Flatpak x86-64-v3 compiler flags
        if: matrix.format == 'flatpak'
        run: |
          manifest=packaging/linux/io.github.brmmm3.Zarg.yml
          if [[ $(grep -c '^    CARGO_HOME:' "$manifest") -ne 1 ]]; then
            echo "Cannot locate the Flatpak build environment in $manifest" >&2
            exit 1
          fi
          if grep -Eq '^    (RUSTFLAGS|CFLAGS|CXXFLAGS):' "$manifest"; then
            echo "Flatpak manifest already defines compiler flags; review the v3 override" >&2
            exit 1
          fi
          sed -i '/^    CARGO_HOME:/a\    RUSTFLAGS: "-C target-cpu=x86-64-v3"\n    CFLAGS: "-march=x86-64-v3"\n    CXXFLAGS: "-march=x86-64-v3"' "$manifest"
      - name: Build package
        env:
          FORMAT: ${{ matrix.format }}
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CFLAGS: -march=x86-64-v3
          CXXFLAGS: -march=x86-64-v3
        run: |
          packaging/linux/build-packages.sh "$FORMAT"
          shopt -s nullglob
          packages=(dist/*.deb dist/*.rpm dist/*.AppImage dist/*.flatpak)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one $FORMAT package" >&2
            exit 1
          fi
          package="${packages[0]}"
          mv "$package" "${package%.*}-v3.${package##*.}"
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.format }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.flatpak
          if-no-files-found: error

  windows-installer:
    name: Windows installer (${{ matrix.arch }})
    needs: find-reusable-ci-run
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            binary_platform: windows-x86_64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            binary_platform: windows-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Windows binaries from successful same-commit CI run
        id: reuse
        if: needs.find-reusable-ci-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zar-rs-binaries-verified-${{ matrix.binary_platform }}
          path: reused
          run-id: ${{ needs.find-reusable-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare reused Windows binaries
        if: steps.reuse.outcome == 'success'
        env:
          BINARY_PLATFORM: ${{ matrix.binary_platform }}
        shell: pwsh
        run: |
          $archive = Join-Path $PWD "reused/zar-rs-$env:BINARY_PLATFORM.zip"
          $destination = Join-Path $PWD "reused/extracted"
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binaryDir = Join-Path $destination "zar-rs-$env:BINARY_PLATFORM"
          foreach ($binary in @('zarc.exe', 'zarg.exe', 'zcopy.exe')) {
            if (!(Test-Path (Join-Path $binaryDir $binary))) {
              throw "Downloaded binary archive is missing $binary`: $binaryDir"
            }
          }
          "BINARY_DIR=$binaryDir" >> $env:GITHUB_ENV
      - name: Install Rust toolchain
        if: steps.reuse.outcome != 'success'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build binaries
        if: steps.reuse.outcome != 'success'
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: ${{ matrix.arch == 'x64' && '-C target-cpu=x86-64-v3' || '' }}
        run: |
          cargo build --release --bins --locked --target $env:TARGET
          "BINARY_DIR=$PWD/target/$env:TARGET/release" >> $env:GITHUB_ENV
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "/DArch=$env:ARCH" "/DSourceDir=$env:BINARY_DIR" packaging\windows\zar-rs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:ARCH -eq 'x64') {
            $packages = @(Get-ChildItem 'dist/*-setup.exe')
            if ($packages.Count -ne 1) { throw 'Expected exactly one Windows installer' }
            Rename-Item $packages[0].FullName ($packages[0].BaseName + '-v3.exe')
          }
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-windows-${{ matrix.arch }}
          path: |
            dist/*-setup.exe
            dist/*-setup-v3.exe
          if-no-files-found: error

  macos-packages:
    name: macOS packages (${{ matrix.arch }})
    needs: find-reusable-ci-run
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            binary_platform: macos-aarch64
          - arch: x86_64
            runner: macos-15-intel
            binary_platform: macos-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download macOS binaries from successful same-commit CI run
        id: reuse
        if: needs.find-reusable-ci-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zar-rs-binaries-verified-${{ matrix.binary_platform }}
          path: reused
          run-id: ${{ needs.find-reusable-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare reused macOS binaries
        if: steps.reuse.outcome == 'success'
        env:
          BINARY_PLATFORM: ${{ matrix.binary_platform }}
        run: |
          mkdir -p dist/reused
          tar -xzf "reused/zar-rs-$BINARY_PLATFORM.tar.gz" -C dist/reused
          echo "BIN_DIR=$PWD/dist/reused/zar-rs-$BINARY_PLATFORM" >> "$GITHUB_ENV"
          echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        if: steps.reuse.outcome != 'success'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
      - name: Build packages
        env:
          ARCH: ${{ matrix.arch }}
          RUSTFLAGS: ${{ matrix.arch == 'x86_64' && '-C target-cpu=x86-64-v3' || '' }}
          CFLAGS: ${{ matrix.arch == 'x86_64' && '-march=x86-64-v3' || '' }}
          CXXFLAGS: ${{ matrix.arch == 'x86_64' && '-march=x86-64-v3' || '' }}
        run: |
          packaging/macos/build-packages.sh all
          if [[ "$ARCH" == x86_64 ]]; then
            for extension in dmg pkg; do
              set -- dist/*."$extension"
              if [[ $# -ne 1 || ! -f "$1" ]]; then
                echo "Expected exactly one .$extension package" >&2
                exit 1
              fi
              mv "$1" "${1%.*}-v3.$extension"
            done
          fi
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.pkg
          if-no-files-found: error

  attach-to-release:
    name: Attach packages to release
    if: startsWith(github.ref, 'refs/tags/') && !endsWith(github.ref_name, '-v1')
    needs: [linux-packages, windows-installer, macos-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          gh release upload "$TAG" packages/* --repo "$REPO" --clobber
