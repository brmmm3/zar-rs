name: Packaging

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-packages:
    name: Linux packages (${{ matrix.format }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm, appimage, flatpak]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
      - name: Install packaging tools
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          sudo apt-get update
          case "$FORMAT" in
            rpm) sudo apt-get install -y rpm ;;
            appimage)
              sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
              curl -fsSL -o /tmp/appimagetool \
                https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x /tmp/appimagetool
              echo "APPIMAGETOOL=/tmp/appimagetool" >> "$GITHUB_ENV"
              echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
              ;;
            flatpak)
              sudo apt-get install -y flatpak flatpak-builder
              flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
              flatpak install --user -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 \
                org.freedesktop.Sdk.Extension.rust-stable//26.08
              ;;
          esac
      - name: Build package
        env:
          FORMAT: ${{ matrix.format }}
        run: packaging/linux/build-packages.sh "$FORMAT"
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.format }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.flatpak
          if-no-files-found: error

  windows-installer:
    name: Windows installer (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build binaries
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --bins --locked --target $env:TARGET
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "/DArch=$env:ARCH" "/DSourceDir=..\..\target\$env:TARGET\release" packaging\windows\zar-rs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-windows-${{ matrix.arch }}
          path: dist/*-setup.exe
          if-no-files-found: error

  macos-packages:
    name: macOS packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
      - name: Build packages
        run: packaging/macos/build-packages.sh all
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.pkg
          if-no-files-found: error

  attach-to-release:
    name: Attach packages to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-packages, windows-installer, macos-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          gh release upload "$TAG" packages/* --repo "$REPO" --clobber
