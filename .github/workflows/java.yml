name: Java bindings

on:
  push:
    branches:
      - master
    tags:
      - "*.*.*"
    paths:
      - "jzarlib-ffm/**"
      - "jzarlib-jni/**"
      - "czarlib/**"
      - "zarlib/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "jzarlib-ffm/**"
      - "jzarlib-jni/**"
      - "czarlib/**"
      - "zarlib/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/java.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.module }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - jzarlib-ffm
          - jzarlib-jni
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
      - name: Set up MSVC environment
        if: matrix.module == 'jzarlib-jni' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec5df6efea59b4d4739c78ca1c2a2aa42cf # v1.13.0
      - name: Build C library
        run: cargo build --manifest-path Cargo.toml -p czarlib
      - name: Build JNI library (Linux)
        if: matrix.module == 'jzarlib-jni' && runner.os == 'Linux'
        run: ./jzarlib-jni/build-native.sh
      - name: Build JNI library (macOS)
        if: matrix.module == 'jzarlib-jni' && runner.os == 'macOS'
        run: ./jzarlib-jni/build-native.sh
      - name: Build JNI library (Windows)
        if: matrix.module == 'jzarlib-jni' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $project = Join-Path $PWD 'jzarlib-jni'
          $native = Join-Path $project 'target/native'
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          $jdkInclude = Join-Path $env:JAVA_HOME 'include'
          $jniHeader = Join-Path $jdkInclude 'win32'
          $cSources = Join-Path $project 'src/main/c/jzarlib_jni.c'
          $cHeaders = Join-Path $PWD 'czarlib/include'
          $importLibrary = Join-Path $PWD 'target/debug/czarlib.dll.lib'
          cl.exe /nologo /O2 /W4 /WX /LD "/I$jdkInclude" "/I$jniHeader" "/I$cHeaders" $cSources $importLibrary /link "/OUT:$native/zarlib_jni.dll"
          Copy-Item (Join-Path $PWD 'target/debug/czarlib.dll') $native
      - name: Test and package Java JAR
        working-directory: ${{ matrix.module }}
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Stage Linux distribution
        if: runner.os == 'Linux'
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          mkdir -p "dist/$MODULE"
          cp "$MODULE/target/$MODULE-"*.jar "dist/$MODULE/"
          if [ "$MODULE" = jzarlib-ffm ]; then
            cp target/debug/libczarlib.so "dist/$MODULE/"
          else
            cp jzarlib-jni/target/native/libzarlib_jni.so target/debug/libczarlib.so "dist/$MODULE/"
          fi
      - name: Stage macOS distribution
        if: runner.os == 'macOS'
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          mkdir -p "dist/$MODULE"
          cp "$MODULE/target/$MODULE-"*.jar "dist/$MODULE/"
          if [ "$MODULE" = jzarlib-ffm ]; then
            cp target/debug/libczarlib.dylib "dist/$MODULE/"
          else
            cp jzarlib-jni/target/native/libzarlib_jni.dylib target/debug/libczarlib.dylib "dist/$MODULE/"
          fi
      - name: Stage Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MODULE: ${{ matrix.module }}
        run: |
          $dist = Join-Path $PWD "dist/$env:MODULE"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$env:MODULE/target/$env:MODULE-*.jar" $dist
          if ($env:MODULE -eq 'jzarlib-ffm') {
            Copy-Item 'target/debug/czarlib.dll' $dist
          } else {
            Copy-Item 'jzarlib-jni/target/native/zarlib_jni.dll', 'target/debug/czarlib.dll' $dist
          }
      - name: Upload Java distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.module }}-${{ matrix.os }}
          path: dist/${{ matrix.module }}/
          if-no-files-found: error
