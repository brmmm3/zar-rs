name: Archive benchmarks

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset to benchmark
        type: choice
        required: false
        default: all
        options:
          - all
          - linux-4.0.1
          - linux-6.1.1
          - duplicates
          - icons
          - small_archive
      os:
        description: Operating system to benchmark (Linux selects both Linux runners)
        type: choice
        required: false
        default: all
        options:
          - all
          - linux
          - windows

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare_matrix:
    name: Select benchmark jobs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          SELECTED_DATASET: ${{ inputs.dataset }}
          SELECTED_OS: ${{ inputs.os }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          platforms = [
              {
                  "name": "linux-x64",
                  "os": "linux",
                  "arch": "x86_64",
                  "runner": "ubuntu-latest",
              },
              {
                  "name": "linux-arm64",
                  "os": "linux",
                  "arch": "arm64",
                  "runner": "ubuntu-24.04-arm",
              },
              {
                  "name": "windows-x64",
                  "os": "windows",
                  "arch": "x86_64",
                  "runner": "windows-latest",
              },
          ]
          datasets = [
              "linux-4.0.1",
              "linux-6.1.1",
              "duplicates",
              "icons",
              "small_archive",
          ]
          selected_dataset = os.environ.get("SELECTED_DATASET") or "all"
          selected_os = os.environ.get("SELECTED_OS") or "all"
          include = [
              {"platform": platform, "dataset": dataset}
              for platform in platforms
              if selected_os == "all" or platform["os"] == selected_os
              for dataset in datasets
              if selected_dataset == "all" or dataset == selected_dataset
          ]
          print(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}")
          PY

  benchmark:
    name: Benchmark (${{ matrix.platform.name }}, ${{ matrix.dataset }})
    needs: prepare_matrix
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: "3.12"
      - name: Install benchmark tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes 7zip zip unzip openssl build-essential flex bison bc libssl-dev libelf-dev
      - name: Install benchmark tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sevenzip zip openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Install benchmark tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install 7zip openssl.light --yes --no-progress
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil scandir-rs
      - name: Run archive benchmark
        run: python scripts/benchmark_archivers.py --mode hot --dataset "${{ matrix.dataset }}"
      - name: Upload dataset benchmark report and chart
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: archive-benchmark-${{ matrix.platform.name }}-${{ matrix.dataset }}
          path: |
            doc/benchmarks/benchmark-report-${{ matrix.platform.os }}-${{ matrix.platform.arch }}*-gh-${{ matrix.dataset }}.md
            doc/benchmarks/benchmark-charts-${{ matrix.platform.os }}-${{ matrix.platform.arch }}*-gh-${{ matrix.dataset }}.svg
          if-no-files-found: warn
