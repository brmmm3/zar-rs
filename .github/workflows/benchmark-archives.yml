name: Archive benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark (${{ matrix.platform.name }}, ${{ matrix.dataset }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: linux
            arch: x86_64
            runner: ubuntu-latest
          - name: linux-arm64
            os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: windows-x64
            os: windows
            arch: x86_64
            runner: windows-latest
          #- name: windows-arm64
          #  os: windows
          #  runner: windows-11-vs2026-arm
          #- name: macos
          #  os: macos
          #  runner: macos-latest
        dataset:
          - linux-4.0.1
          - linux-6.1.1
          - duplicates
          - icons
          - small_archive
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: "3.12"
      - name: Install benchmark tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes 7zip zip unzip openssl build-essential flex bison bc libssl-dev libelf-dev
      - name: Install benchmark tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sevenzip zip openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Install benchmark tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install 7zip openssl.light --yes --no-progress
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil scandir-rs
      - name: Run archive benchmark
        run: python scripts/benchmark_archivers.py --mode hot --dataset "${{ matrix.dataset }}"
      - name: Upload dataset benchmark report and chart
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: archive-benchmark-${{ matrix.platform.name }}-${{ matrix.dataset }}
          path: |
            doc/benchmarks/benchmark-report-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.dataset }}*-gh.md
            doc/benchmarks/benchmark-charts-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.dataset }}*-gh.svg
          if-no-files-found: warn
