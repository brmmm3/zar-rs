name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  cargo-fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  cargo-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  cargo-test:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
      - name: Run workspace tests
        run: cargo test --workspace

  czarlib:
    name: C library and CLI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
      - name: Build C library
        run: cargo build --locked -p czarlib
      - name: Run native zarlib tests
        run: cargo test --locked -p zarlib
      - name: Run C API integration tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I czarlib/include \
            czarlib/tests/test_c_api.c -L target/debug -lczarlib \
            -Wl,-rpath,"$PWD/target/debug" -pthread -o /tmp/czarlib-test
          /tmp/czarlib-test
      - name: Build and exercise C zarc example
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I czarlib/include \
            czarlib/examples/zarc.c -L target/debug -lczarlib \
            -Wl,-rpath,"$PWD/target/debug" -o /tmp/zarc-c
          /tmp/zarc-c --help
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          printf 'initial' > "$temp_dir/input.txt"
          printf 'added' > "$temp_dir/added.txt"
          (
            cd "$temp_dir"
            /tmp/zarc-c c sample.zar input.txt
            /tmp/zarc-c a sample.zar added.txt
            /tmp/zarc-c k sample.zar
            info_json=$(/tmp/zarc-c i sample.zar)
            printf '%s\n' "$info_json"
            from_id=$(printf '%s' "$info_json" | jq -r '.[0].id')
            through_id=$(printf '%s' "$info_json" | jq -r '.[1].id')
            test "$from_id" != null
            test "$through_id" != null
            /tmp/zarc-c l sample.zar
            /tmp/zarc-c e sample.zar restored --dry-run
            /tmp/zarc-c r sample.zar added.txt
            /tmp/zarc-c j sample.zar --from "$from_id" --through "$through_id"
          )

  wasizarlib:
    name: Build wasizarlib (WASI Preview 2)
    needs: [cargo-fmt, cargo-clippy, cargo-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WASI Preview 2 target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - name: Install WASI C compiler
        run: sudo apt-get update && sudo apt-get install --yes clang wasi-libc
      - name: Build component
        env:
          CFLAGS_wasm32_wasip2: -isystem /usr/include/wasm32-wasi
        run: cargo build --release --locked -p wasizarlib --target wasm32-wasip2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Node.js package dependencies
        working-directory: wasizarlib/nodejs
        run: npm ci --include=optional
      - name: Transpile component and run Node.js tests
        working-directory: wasizarlib/nodejs
        run: |
          npm run build:js
          npm test
      - name: Package Node.js module
        working-directory: wasizarlib/nodejs
        run: |
          mkdir -p ../../target/wasizarlib-node
          npm pack --pack-destination ../../target/wasizarlib-node
      - name: Package component
        run: |
          mkdir -p dist/wasizarlib
          mkdir -p dist/wasizarlib/wit
          cp target/wasm32-wasip2/release/wasizarlib.wasm dist/wasizarlib/
          cp wasizarlib/README.md dist/wasizarlib/
          cp wasizarlib/wit/world.wit dist/wasizarlib/wit/
          cp target/wasizarlib-node/*.tgz dist/wasizarlib/
          tar -C dist -czf dist/wasizarlib-wasip2.tar.gz wasizarlib
      - name: Upload component
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: wasizarlib-wasip2
          path: dist/wasizarlib-wasip2.tar.gz
          if-no-files-found: error

  pyzarlib:
    name: pyzarlib tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
          - python-version: "3.12"
          - python-version: "3.13"
          - python-version: "3.14"
          - python-version: "3.15"
          - python-version: "3.14t"
            free_threaded: true
          - python-version: "3.15t"
            free_threaded: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python test tools
        working-directory: pyzarlib
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          source .venv/bin/activate
          python -m pip install --upgrade pip maturin pytest
      - name: Build and install extension
        working-directory: pyzarlib
        run: maturin develop --release
      - name: Run Python tests
        working-directory: pyzarlib
        run: |
          if [[ "${{ matrix.free_threaded }}" == "true" ]]; then
            PYTHON_GIL=0 python -Wd -m pytest
          else
            python -Wd -m pytest
          fi

  csharp-test:
    name: Test ZarLib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
      - name: Build native C library
        run: cargo build --locked -p czarlib
      - name: Test C# wrapper
        run: dotnet test csharpzarlib/ZarLib.Tests/ZarLib.Tests.csproj --configuration Release

  csharp-pack-windows:
    name: Pack ZarLib (${{ matrix.arch.name }})
    needs: csharp-test
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            rid: win-x64
          - name: arm64
            runner: windows-11-vs2026-arm
            rust-target: aarch64-pc-windows-msvc
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
          targets: ${{ matrix.arch.rust-target }}
      - name: Build native C library
        run: cargo build --locked --release -p czarlib --target ${{ matrix.arch.rust-target }}
      - name: Pack architecture-specific NuGet package
        shell: pwsh
        run: |
          $nativeLibrary = Join-Path $PWD "target/${{ matrix.arch.rust-target }}/release/czarlib.dll"
          dotnet pack csharpzarlib/ZarLib/ZarLib.csproj --configuration Release --output artifacts `
            -p:PackageId=ZarLib.${{ matrix.arch.name }} `
            -p:RuntimeIdentifier=${{ matrix.arch.rid }} `
            -p:NativeLibraryPath="$nativeLibrary"
      - name: Upload NuGet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ZarLib-${{ matrix.arch.name }}-nuget
          path: artifacts/*.nupkg
          if-no-files-found: error

  java-bindings:
    name: Java bindings (${{ matrix.module }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - jzarlib-ffm
          - jzarlib-jni
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
      - name: Set up MSVC environment
        if: matrix.module == 'jzarlib-jni' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Build C library
        run: cargo build --manifest-path Cargo.toml -p czarlib
      - name: Build JNI library (Linux)
        if: matrix.module == 'jzarlib-jni' && runner.os == 'Linux'
        run: ./jzarlib-jni/build-native.sh
      - name: Build JNI library (macOS)
        if: matrix.module == 'jzarlib-jni' && runner.os == 'macOS'
        run: ./jzarlib-jni/build-native.sh
      - name: Build JNI library (Windows)
        if: matrix.module == 'jzarlib-jni' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $project = Join-Path $PWD 'jzarlib-jni'
          $native = Join-Path $project 'target/native'
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          $jdkInclude = Join-Path $env:JAVA_HOME 'include'
          $jniHeader = Join-Path $jdkInclude 'win32'
          $cSources = Join-Path $project 'src/main/c/jzarlib_jni.c'
          $cHeaders = Join-Path $PWD 'czarlib/include'
          $importLibrary = Join-Path $PWD 'target/debug/czarlib.dll.lib'
          cl.exe /nologo /O2 /W4 /WX /LD "/I$jdkInclude" "/I$jniHeader" "/I$cHeaders" $cSources $importLibrary /link "/OUT:$native/zarlib_jni.dll"
          Copy-Item (Join-Path $PWD 'target/debug/czarlib.dll') $native
          Add-Content -Path $env:GITHUB_PATH -Value $native
      - name: Test and package Java JAR
        working-directory: ${{ matrix.module }}
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Stage Linux distribution
        if: runner.os == 'Linux'
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          mkdir -p "dist/$MODULE"
          cp "$MODULE/target/$MODULE-"*.jar "dist/$MODULE/"
          if [ "$MODULE" = jzarlib-ffm ]; then
            cp target/debug/libczarlib.so "dist/$MODULE/"
          else
            cp jzarlib-jni/target/native/libzarlib_jni.so target/debug/libczarlib.so "dist/$MODULE/"
          fi
      - name: Stage macOS distribution
        if: runner.os == 'macOS'
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          mkdir -p "dist/$MODULE"
          cp "$MODULE/target/$MODULE-"*.jar "dist/$MODULE/"
          if [ "$MODULE" = jzarlib-ffm ]; then
            cp target/debug/libczarlib.dylib "dist/$MODULE/"
          else
            cp jzarlib-jni/target/native/libzarlib_jni.dylib target/debug/libczarlib.dylib "dist/$MODULE/"
          fi
      - name: Stage Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MODULE: ${{ matrix.module }}
        run: |
          $dist = Join-Path $PWD "dist/$env:MODULE"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$env:MODULE/target/$env:MODULE-*.jar" $dist
          if ($env:MODULE -eq 'jzarlib-ffm') {
            Copy-Item 'target/debug/czarlib.dll' $dist
          } else {
            Copy-Item 'jzarlib-jni/target/native/zarlib_jni.dll', 'target/debug/czarlib.dll' $dist
          }
      - name: Upload Java distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.module }}-${{ matrix.os }}
          path: dist/${{ matrix.module }}/
          if-no-files-found: error

  build-binaries:
    name: Build binaries (${{ matrix.platform.name }})
    needs: [cargo-fmt, cargo-clippy, cargo-test]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: linux-x86_64-static
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            linker: musl-gcc
            linker-env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
            static: true
          - name: linux-aarch64-static
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            linker: musl-gcc
            linker-env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
            static: true
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev pkg-config
      - name: Install musl toolchain
        if: matrix.platform.static == true
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # zizmor: ignore[unpinned-uses]
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}
      - name: Build zarc and zarg
        env:
          RUSTFLAGS: ${{ matrix.platform.static && '-C target-feature=+crt-static' || '' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.platform.linker-env == 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER' && matrix.platform.linker || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.platform.linker-env == 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER' && matrix.platform.linker || '' }}
        run: cargo build --release --bins --locked --target ${{ matrix.platform.target }}
      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform.name }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          mkdir -p dist/zar-rs-$PLATFORM
          cp target/$TARGET/release/zarc target/$TARGET/release/zarg dist/zar-rs-$PLATFORM/
          tar -C dist -czf dist/zar-rs-$PLATFORM.tar.gz zar-rs-$PLATFORM
      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform.name }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          New-Item -ItemType Directory -Force -Path "dist/zar-rs-$env:PLATFORM" | Out-Null
          Copy-Item "target/$env:TARGET/release/zarc.exe", "target/$env:TARGET/release/zarg.exe" "dist/zar-rs-$env:PLATFORM/"
          Compress-Archive -Path "dist/zar-rs-$env:PLATFORM" -DestinationPath "dist/zar-rs-$env:PLATFORM.zip"
      - name: Upload binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: zar-rs-binaries-${{ matrix.platform.name }}
          path: dist/zar-rs-${{ matrix.platform.name }}.*
          if-no-files-found: error

  release-wheels:
    name: Build wheels (${{ matrix.platform.name }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: [cargo-fmt, cargo-clippy, cargo-test, pyzarlib, build-binaries]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64
            manylinux: auto
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64
          - name: windows-x64
            runner: windows-latest
            target: x64
          - name: windows-aarch64
            runner: windows-latest
            target: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          rust-toolchain: stable
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter 3.11 3.12 3.13 3.14 3.15
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          working-directory: pyzarlib
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: pyzarlib-wheels-${{ matrix.platform.name }}
          path: pyzarlib/dist/*.whl
          if-no-files-found: error

  release-sdist:
    name: Build source distribution
    if: startsWith(github.ref, 'refs/tags/')
    needs: [cargo-fmt, cargo-clippy, cargo-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          rust-toolchain: stable
          working-directory: pyzarlib
      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: pyzarlib-sdist
          path: pyzarlib/dist/*.tar.gz
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binaries, release-wheels, release-sdist, wasizarlib, csharp-pack-windows, java-bindings]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: pyzarlib-*
          path: dist
          merge-multiple: true
      - name: Download binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: zar-rs-binaries-*
          path: dist
          merge-multiple: true
      - name: Download WASI component artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: wasizarlib-wasip2
          path: dist
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: ZarLib-*-nuget
          path: dist
          merge-multiple: true
      - name: Download Java distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: jzarlib-*
          path: java-artifacts
      - name: Package Java release assets
        shell: bash
        run: |
          shopt -s nullglob
          distributions=(java-artifacts/jzarlib-*)
          test "${#distributions[@]}" -eq 6
          for distribution in "${distributions[@]}"; do
            name=${distribution##*/}
            jars=("$distribution"/*.jar)
            test "${#jars[@]}" -eq 1
            cp "${jars[0]}" "dist/$name.jar"
            tar -czf "dist/$name.tar.gz" -C java-artifacts "$name"
          done
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
