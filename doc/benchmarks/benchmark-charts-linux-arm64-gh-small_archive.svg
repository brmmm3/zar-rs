<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2680" viewBox="0 0 1120 2680" role="img" aria-labelledby="title description">
<title id="title">linux arm64 archive benchmark charts</title>
<desc id="description">Archive size, compression time, full and three-file extraction time, CPU utilisation, and RAM usage for archive formats with and without encryption, with hot and cold file caches where available. Source size: 7.7 MiB. Operating system: Linux-7.0.0-1017-azure-aarch64-with-glibc2.39. CPU: Not reported by operating system (aarch64, 4 logical cores). Storage (Source and archives): HDD / rotational; model: Virtual Disk; device: sda; Storage (Extraction output): HDD / rotational; model: Virtual Disk; device: sda</desc>
<style>
  text { font-family: system-ui, sans-serif; fill: #172033; }
  .heading { font-size: 19px; font-weight: 700; }
  .label { font-size: 13px; }
  .metadata { font-size: 12px; fill: #475569; }
  .axis { font-size: 11px; fill: #64748b; }
  .value { font-size: 12px; font-weight: 600; }
  .grid { stroke: #dbe3ee; stroke-width: 1; }
</style>
