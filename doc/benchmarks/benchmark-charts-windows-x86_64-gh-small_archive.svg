<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2440" viewBox="0 0 1120 2440" role="img" aria-labelledby="title description">
<title id="title">windows x86_64 archive benchmark charts</title>
<desc id="description">Archive size, compression time, full and three-file extraction time, CPU utilisation, and RAM usage for archive formats with and without encryption, with hot and cold file caches where available. Source size: 7.7 MiB. Operating system: Windows-2025Server-10.0.26100-SP0. CPU: AMD EPYC 9V74 80-Core Processor (AMD64, 4 logical cores). Storage (Source and archives): SSD (NVMe); model: Microsoft NVMe Direct Disk v2; device: disk 1 (NVMe); Storage (Extraction output): SSD (NVMe); model: Microsoft NVMe Direct Disk v2; device: disk 1 (NVMe)</desc>
