<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2680" viewBox="0 0 1120 2680" role="img" aria-labelledby="title description">
<title id="title">linux x86_64 archive benchmark charts</title>
<desc id="description">Archive size, compression time, full and three-file extraction time, CPU utilisation, and RAM usage for archive formats with and without encryption, with hot and cold file caches where available. Source size: 7.7 MiB. Operating system: Linux-7.0.0-1019-azure-x86_64-with-glibc2.43. CPU: INTEL(R) XEON(R) PLATINUM 8573C (x86_64, 4 logical cores). Storage (Source and archives): SSD / non-rotational (may be virtual); model: MSFT NVMe Accelerator v1.0; device: nvme0n1; Storage (Extraction output): SSD / non-rotational (may be virtual); model: MSFT NVMe Accelerator v1.0; device: nvme0n1</desc>
