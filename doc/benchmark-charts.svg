<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="925" viewBox="0 0 1120 925" role="img" aria-labelledby="title description">
<title id="title">Linux 4.0.1 archive benchmark charts</title>
<desc id="description">Archive size, compression time, and extraction time for four archive formats with and without encryption. Source size: 525.1 MiB.</desc>
<style>
  text { font-family: system-ui, sans-serif; fill: #172033; }
  .heading { font-size: 19px; font-weight: 700; }
  .label { font-size: 13px; }
  .axis { font-size: 11px; fill: #64748b; }
  .value { font-size: 12px; font-weight: 600; }
  .grid { stroke: #dbe3ee; stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="40" class="heading">Archive size</text>
<line x1="250" y1="74" x2="250" y2="314" class="grid"/>
<text x="250" y="66" text-anchor="middle" class="axis">0.0</text>
<line x1="425" y1="74" x2="425" y2="314" class="grid"/>
<text x="425" y="66" text-anchor="middle" class="axis">38.3</text>
