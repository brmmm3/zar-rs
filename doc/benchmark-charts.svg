<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1210" viewBox="0 0 1120 1210" role="img" aria-labelledby="title description">
<title id="title">Linux 4.0.1 archive benchmark charts</title>
<desc id="description">Archive size, compression time, and extraction time for archive formats with and without encryption, with hot and cold file caches where available. Source size: 525.1 MiB.</desc>
