[workspace]
members = ["zarlib", "zarc"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
xxhash-rust = { version = "0.8", features = ["xxh64"] }
aes-gcm = "0.11"
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.4"
zeroize = "1.9"
