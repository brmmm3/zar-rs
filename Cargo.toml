[workspace]
members = ["zarlib", "zarc", "zarg", "pyzarlib", "czarlib", "cxxzarlib", "zcopy"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.5.0"
license = "MIT OR Apache-2.0"
authors = ["Martin Bammer <mrbm74@gmail.com>"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = "0.6"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
globset = "0.4"
zeroize = "1.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
