[package]
name = "zarlib-gui"
description = "Graphical user interface for managing ZAR archives"
documentation = "https://github.com/brmmm3/zar-rs/blob/master/zarlib-gui/README.md"
homepage = "https://github.com/brmmm3/zar-rs"
repository = "https://github.com/brmmm3/zar-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "zarg"
path = "src/main.rs"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "x11",
    "wayland",
] }
catppuccin-egui = { version = "5.7.0", default-features = false, features = [
    "egui33",
] }
globset = { version = "0.4", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
regex = { version = "1.13.1", default-features = false, features = [
    "perf",
    "std",
    "unicode",
] }
dirs = "7"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
tempfile = "3"
zarlib = { version = "0.12.0", path = "../zarlib" }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
url = "2"
wayland-client = { version = "0.31", features = ["system"] }

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = [
    "win_direct_tls",
], optional = true }

[target.'cfg(unix)'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = [
    "local_dynamic_tls",
], optional = true }

[target.'cfg(not(all(target_os = "linux", target_env = "musl")))'.dependencies]
display-info = "0.5.10"
