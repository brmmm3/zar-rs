[package]
name = "pyzarlib"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[lib]
name = "_pyzarlib"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
zarlib = { path = "../zarlib" }

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = [
    "win_direct_tls",
], optional = true }

[target.'cfg(all(unix, not(all(target_os = "linux", target_arch = "aarch64"))))'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = [
    "local_dynamic_tls",
], optional = true }
