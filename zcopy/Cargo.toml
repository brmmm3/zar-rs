[package]
name = "zarlib-zcopy"
description = "Command-line tool for transferring directory trees using ZAR"
documentation = "https://github.com/brmmm3/zar-rs/blob/master/zcopy/README.md"
homepage = "https://github.com/brmmm3/zar-rs"
repository = "https://github.com/brmmm3/zar-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/zar-rs-{ target }.tar.gz"
bin-dir = "zar-rs-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/zar-rs-linux-x86_64.tar.gz"
bin-dir = "zar-rs-linux-x86_64/{ bin }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/zar-rs-linux-aarch64.tar.gz"
bin-dir = "zar-rs-linux-aarch64/{ bin }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/zar-rs-linux-x86_64-static.tar.gz"
bin-dir = "zar-rs-linux-x86_64-static/{ bin }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/zar-rs-linux-aarch64-static.tar.gz"
bin-dir = "zar-rs-linux-aarch64-static/{ bin }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/{ version }/zar-rs-windows-x86_64.zip"
bin-dir = "zar-rs-windows-x86_64/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/{ version }/zar-rs-windows-aarch64.zip"
bin-dir = "zar-rs-windows-aarch64/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/zar-rs-macos-x86_64.tar.gz"
bin-dir = "zar-rs-macos-x86_64/{ bin }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/zar-rs-macos-aarch64.tar.gz"
bin-dir = "zar-rs-macos-aarch64/{ bin }"

[[bin]]
name = "zcopy"
path = "src/main.rs"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
clap.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
indicatif.workspace = true
zstd = "0.14.3"
scandir = "4.0"

zarlib = { version = "0.17.0", path = "../zarlib" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = [
    "win_direct_tls",
], optional = true }

[target.'cfg(unix)'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = [
    "local_dynamic_tls",
], optional = true }
