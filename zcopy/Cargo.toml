[package]
name = "zarlib-zcopy"
description = "Command-line tool for transferring directory trees using ZAR"
documentation = "https://github.com/brmmm3/zar-rs/blob/master/zcopy/README.md"
homepage = "https://github.com/brmmm3/zar-rs"
repository = "https://github.com/brmmm3/zar-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "zcopy"
path = "src/main.rs"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
clap.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
indicatif.workspace = true
zstd = "0.14.3"
scandir = "3.1"

zarlib = { version = "0.11.0", path = "../zarlib" }

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = [
    "win_direct_tls",
], optional = true }

[target.'cfg(unix)'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = [
    "local_dynamic_tls",
], optional = true }
