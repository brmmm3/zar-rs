[package]
name = "zarlib"
description = "ZAR archive library with compression, deduplication, and commit-based history"
documentation = "https://github.com/brmmm3/zar-rs/blob/master/doc/zarlib-developer-guide.md"
homepage = "https://github.com/brmmm3/zar-rs"
repository = "https://github.com/brmmm3/zar-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
globset.workspace = true
xxhash-rust.workspace = true
zeroize.workspace = true
rayon.workspace = true
regex = "1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sysinfo = "0.40"
libc = "0.2"
zstd = "0.14.3"
tempfile = "3"
tar = { version = "0.4", default-features = false }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "ppmd", "brotli", "deflate", "lz4", "zstd"] }
rars = { version = "0.13.0", default-features = false }
libmkiso = { version = "0.1.5", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
clap.workspace = true
indicatif.workspace = true
rars = { version = "0.13.0", default-features = false, features = ["write", "encryption"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
crossbeam-channel = "0.5"
rayon.workspace = true
scandir = "4.0"

[target.'cfg(windows)'.dependencies]
jwalk-meta = "1.2"
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
